<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Hümeyra ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12vh 15px 5vh 15px;
            z-index: 10;
        }
        #title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 20, 147, 0.6);
            text-align: center;
        }
        #sub-title {
            color: #ffb6c1;
            font-size: 0.95rem;
            opacity: 0.85;
            font-style: italic;
            text-align: center;
            margin-top: 6px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }
        #footer {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-align: center;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        @media (max-width: 600px) {
            #title { font-size: 1.5rem; }
            #sub-title { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div>
            <div id="title">Love Heart For Her</div>
            <div id="sub-title">this is for you, Hümeyra ✨</div>
        </div>
        <div id="footer">Ekrana dokunarak döndürebilirsin ❤️</div>
    </div>

    <!-- Three.js ve OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. Temel Kurulum ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Telefona özel kamera mesafesi hesabı (Dikey ekranlarda geriye çekilir)
        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) { // Telefon ekranı (Dikey)
                camera.position.set(0, 0, 42 / aspect * 0.75);
            } else { // Bilgisayar ekranı (Yatay)
                camera.position.set(0, 0, 32);
            }
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false; // Telefon ekranında yanlışlıkla büyüyüp bozulmasın

        // --- 2. Ortak Ayarlar ---
        const colorChoices = ['#ff0055', '#ff1493', '#ff69b4', '#ffb6c1', '#ffffff', '#ffd7e0'];

        function createPoints(count, positionsFn, colorFn) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const pos = positionsFn(i, count);
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                const color = new THREE.Color(colorFn(i, count));
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            return geometry;
        }

        // --- 3. Şekil Tanımlamaları ---

        // A. Dış Büyük Kalp
        const outerHeartPositions = (i, count) => {
            const t = (i / count) * Math.PI * 2;
            const size = 0.52;
            let x = size * (16 * Math.pow(Math.sin(t), 3));
            let y = size * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            let z = (Math.random() - 0.5) * 3;
            
            const scatter = 0.08;
            x += (Math.random() - 0.5) * scatter * 5;
            y += (Math.random() - 0.5) * scatter * 5;
            return { x, y: y - 1, z }; // Hafifçe merkeze hizalama
        };
        const outerHeartColor = () => colorChoices[Math.floor(Math.random() * colorChoices.length)];
        const outerHeartGeom = createPoints(5500, outerHeartPositions, outerHeartColor);

        // B. İç Küçük Kalp
        const innerHeartPositions = (i, count) => {
            const t = (i / count) * Math.PI * 2;
            const size = 0.27;
            let x = size * (16 * Math.pow(Math.sin(t), 3));
            let y = size * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            let z = (Math.random() - 0.5) * 2;
            
            const scatter = 0.08;
            x += (Math.random() - 0.5) * scatter * 3;
            y += (Math.random() - 0.5) * scatter * 3;
            return { x, y: y - 1, z };
        };
        const innerHeartColor = () => colorChoices[Math.floor(Math.random() * 2)];
        const innerHeartGeom = createPoints(2800, innerHeartPositions, innerHeartColor);

        // C. Merkezdeki 'H' Harfi
        const letterHPositions = (i, count) => {
            const t = i / count;
            const size = 1.6;
            let x, y, z;
            if (t < 1/3) { // Sol çizgi
                x = -size * 0.65;
                y = (t * 3 - 0.5) * size * 1.4;
            } else if (t < 2/3) { // Sağ çizgi
                x = size * 0.65;
                y = ((t - 1/3) * 3 - 0.5) * size * 1.4;
            } else { // Orta çizgi
                x = ((t - 2/3) * 3 - 0.5) * size * 1.3;
                y = 0;
            }
            z = (Math.random() - 0.5) * 1.2;
            const ripple = 0.12;
            x += (Math.random() - 0.5) * ripple;
            y += (Math.random() - 0.5) * ripple;
            return { x, y: y - 1, z };
        };
        const letterHColor = () => '#ffffff';
        const letterHGeom = createPoints(1800, letterHPositions, letterHColor);

        // --- 4. Materyaller ---
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,105,180,0.8)');
            gradient.addColorStop(0.8, 'rgba(255,20,147,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createParticleTexture();

        const commonMatSettings = {
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.85,
        };

        const outerHeartMat = new THREE.PointsMaterial({ ...commonMatSettings, size: 0.45 });
        const innerHeartMat = new THREE.PointsMaterial({ ...commonMatSettings, size: 0.4 });
        const letterHMat = new THREE.PointsMaterial({ ...commonMatSettings, size: 0.45, opacity: 1.0 });

        const outerHeart = new THREE.Points(outerHeartGeom, outerHeartMat);
        const innerHeart = new THREE.Points(innerHeartGeom, innerHeartMat);
        const letterH = new THREE.Points(letterHGeom, letterHMat);

        scene.add(outerHeart);
        scene.add(innerHeart);
        scene.add(letterH);

        // Arka plan yıldızları
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 350;
        const starsPositions = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) {
            starsPositions[i] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffb6c1, size: 0.2, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 5. Animasyon Döngüsü ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Yumuşak dönüşler
            outerHeart.rotation.y = elapsedTime * 0.12;
            innerHeart.rotation.y = elapsedTime * 0.22;
            letterH.rotation.y = elapsedTime * 0.32;

            // Nabız Atışı
            const pulse = 1 + Math.sin(elapsedTime * 3.5) * 0.05;
            outerHeart.scale.set(pulse, pulse, pulse);
            
            const innerPulse = 1 + Math.sin(elapsedTime * 4) * 0.07;
            innerHeart.scale.set(innerPulse, innerPulse, innerPulse);

            const hPulse = 1 + Math.sin(elapsedTime * 4.5) * 0.08;
            letterH.scale.set(hPulse, hPulse, hPulse);

            stars.rotation.y = elapsedTime * 0.02;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Ekran Boyutu Değiştiğinde Otomatik Güncelleme
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            updateCameraPosition();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
